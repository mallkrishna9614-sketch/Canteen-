<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Checkout - LPU Canteen</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <style>
        body { background: #f8f9fa; }
        .checkout-container { max-width: 1200px; margin: 100px auto 50px; padding: 0 32px; display: grid; grid-template-columns: 1.5fr 1fr; gap: 40px; }
        .checkout-card { background: #fff; padding: 32px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); border: 1px solid var(--gray-200); }
        .checkout-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 24px; color: var(--gray-900); }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--gray-700); }
        .form-group input, .form-group select { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--gray-300); font-family: 'Poppins', sans-serif; font-size: 1rem; transition: all 0.3s; }
        .form-group input:focus, .form-group select:focus { border-color: var(--orange); outline: none; box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.1); }
        
        .payment-methods { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 30px; }
        .payment-method { padding: 16px; border: 2px solid var(--gray-200); border-radius: 16px; text-align: center; cursor: pointer; transition: all 0.3s; font-weight: 600; color: var(--gray-600); }
        .payment-method.selected { border-color: var(--orange); background: rgba(255, 107, 0, 0.05); color: var(--orange); }
        .payment-method:hover { border-color: var(--orange-light); }
        
        .summary-item { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid var(--gray-100); animation: fadeIn 0.3s ease; }
        .item-info { display: flex; align-items: center; gap: 16px; }
        .item-img { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; }
        .item-details h4 { font-size: 1.1rem; color: var(--gray-900); }
        .item-price { font-weight: 700; font-size: 1.1rem; }
        
        .qty-controls { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
        .qty-btn { width: 28px; height: 28px; border-radius: 6px; border: none; background: var(--gray-100); font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .qty-btn:hover { background: var(--gray-200); }
        .qty-display { font-weight: 600; min-width: 20px; text-align: center; }
        .remove-btn { background: none; border: none; color: #ef4444; cursor: pointer; margin-left: 8px; font-size: 1.2rem; transition: transform 0.2s; }
        .remove-btn:hover { transform: scale(1.1); }

        .pricing-row { display: flex; justify-content: space-between; margin-bottom: 16px; color: var(--gray-600); }
        .pricing-row.total { font-size: 1.5rem; font-weight: 800; color: var(--gray-900); border-top: 2px dashed var(--gray-200); padding-top: 20px; margin-top: 10px; }
        
        .place-order-btn { width: 100%; padding: 18px; background: linear-gradient(135deg, var(--orange), #ff4500); color: white; border: none; border-radius: 16px; font-size: 1.2rem; font-weight: 800; cursor: pointer; transition: transform 0.3s, box-shadow 0.3s; margin-top: 24px; position: relative; overflow: hidden; }
        .place-order-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(255, 107, 0, 0.3); }
        .place-order-btn.loading { color: transparent; pointer-events: none; }
        .place-order-btn.loading::after { content: ''; position: absolute; left: 50%; top: 50%; width: 24px; height: 24px; margin-left: -12px; margin-top: -12px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .checkout-container { gap: 24px; padding: 0 20px; margin: 80px auto 40px; }
            .checkout-card { padding: 24px; border-radius: 18px; }
            .checkout-title { font-size: 1.5rem; }
        }
        @media (max-width: 768px) {
            .checkout-container { grid-template-columns: 1fr; margin: 80px auto 30px; padding: 0 16px; gap: 20px; }
            .checkout-card { padding: 20px; border-radius: 16px; }
            .checkout-title { font-size: 1.35rem; }
            .payment-methods { grid-template-columns: 1fr; gap: 12px; }
            .payment-method { padding: 16px; font-size: 0.95rem; }
            .place-order-btn { padding: 16px; font-size: 1.1rem; border-radius: 12px; }
            .qty-btn { width: 44px; height: 44px; font-size: 1.1rem; border-radius: 8px; }
        }
        @media (max-width: 480px) {
            .checkout-container { margin: 72px auto 20px; padding: 0 10px; }
            .checkout-card { padding: 16px; border-radius: 12px; }
            .form-group input, .form-group select { padding: 10px 12px; font-size: 0.95rem; }
            .payment-method { padding: 12px; font-size: 0.9rem; }
        }
        @media (max-width: 360px) {
            .checkout-container { padding: 0 6px; }
            .checkout-card { padding: 12px; }
            .checkout-title { font-size: 1.2rem; }
        }
    </style>
</head>
<body class="dashboard-body">
    <header class="navbar fade-in">
        <div class="nav-container">
            <div class="nav-left">
                <a href="dashboard.html" class="nav-logo">
                    <span class="logo-icon">🍽️</span>
                    <span class="logo-text">LPU<span class="orange">Canteen</span></span>
                </a>
            </div>
            <div class="nav-right">
                <a href="cart.html" class="hero-cta" style="padding: 10px 20px; font-size: 0.85rem; text-decoration: none; background: var(--gray-100); color: var(--gray-900);">Back to Cart</a>
            </div>
        </div>
    </header>

    <div class="checkout-container">
        <div class="checkout-form checkout-card">
            <h2 class="checkout-title">Pickup Details</h2>
            <div class="form-group">
                <label>Student Name</label>
                <input type="text" id="s_name" placeholder="e.g. John Doe" required>
            </div>
            <div class="form-group">
                <label>Registration Number</label>
                <input type="text" id="s_reg" placeholder="e.g. 12000000" required>
            </div>
            <div class="form-group">
                <label>Select Canteen</label>
                <select id="s_canteen">
                    <option>Oven Xpress</option>
                    <option>Coffee Day</option>
                    <option>The fresh juice</option>
                    <option>Kitchenettee</option>
                    <option>Tea Point</option>
                </select>
            </div>
            <div class="form-group">
                <label>Pickup Time Slot</label>
                <select id="s_time">
                    <option>12:00 PM - 12:15 PM</option>
                    <option>12:15 PM - 12:30 PM</option>
                    <option>12:30 PM - 12:45 PM</option>
                    <option>1:00 PM - 1:15 PM</option>
                </select>
            </div>

            <h2 class="checkout-title" style="margin-top: 40px;">Payment Method</h2>
            <div class="payment-methods">
                <div class="payment-method selected" onclick="selectPayment(this, 'Razorpay')">Razorpay (Test)</div>
                <div class="payment-method" onclick="selectPayment(this, 'UPI')">UPI</div>
            </div>
        </div>

        <div class="checkout-summary checkout-card">
            <h2 class="checkout-title">Order Summary</h2>
            <div id="cart-items-container" style="margin-bottom: 24px;"></div>
            <div class="pricing-row">
                <span>Subtotal</span>
                <span id="summary-subtotal">₹0</span>
            </div>
            <div class="pricing-row">
                <span>Packaging Fee</span>
                <span>₹10</span>
            </div>
            <div class="pricing-row total">
                <span>Total</span>
                <span id="summary-total">₹0</span>
            </div>
            <button id="payBtn" class="place-order-btn" onclick="handleCheckout()">Pay & Place Order</button>
        </div>
    </div>

    <!-- Razorpay SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        // =============================================
        // READ CART IMMEDIATELY — before DOMContentLoaded
        // =============================================
        var finalTotal = 0;
        var selectedMethod = 'Razorpay';
        var cart = [];

        (function loadCart() {
            try {
                var raw = localStorage.getItem('cart');
                console.log('[Checkout] Raw cart from localStorage:', raw);
                var parsed = JSON.parse(raw);
                cart = Array.isArray(parsed) ? parsed : [];
                console.log('[Checkout] Parsed cart:', cart.length, 'items');
            } catch(e) {
                console.error('[Checkout] Cart parse error:', e);
                cart = [];
            }
        })();

        // =============================================
        // TOAST
        // =============================================
        function showToast(msg) {
            var t = document.createElement('div');
            t.textContent = msg;
            Object.assign(t.style, {
                position:'fixed', bottom:'100px', right:'30px',
                background:'#1a1a2e', color:'#fff', padding:'12px 24px',
                borderRadius:'8px', boxShadow:'0 10px 30px rgba(0,0,0,0.2)',
                zIndex:'9999', opacity:'0', transform:'translateY(20px)',
                transition:'all 0.3s ease', fontFamily:'Poppins,sans-serif',
                fontWeight:'600', fontSize:'0.95rem'
            });
            document.body.appendChild(t);
            setTimeout(function(){ t.style.opacity='1'; t.style.transform='translateY(0)'; }, 10);
            setTimeout(function(){ t.style.opacity='0'; t.style.transform='translateY(20px)'; setTimeout(function(){ t.remove(); },300); }, 2500);
        }

        // =============================================
        // PAYMENT METHOD SELECTOR
        // =============================================
        function selectPayment(el, method) {
            document.querySelectorAll('.payment-method').forEach(function(p){ p.classList.remove('selected'); });
            el.classList.add('selected');
            selectedMethod = method;
            console.log('[Checkout] Selected method:', method);
        }

        // =============================================
        // RENDER CART
        // =============================================
        function renderCheckoutCart() {
            // Always re-read from localStorage to get latest
            try {
                var raw = localStorage.getItem('cart');
                var parsed = JSON.parse(raw);
                cart = Array.isArray(parsed) ? parsed : [];
            } catch(e) {
                cart = [];
            }

            var container = document.getElementById('cart-items-container');
            var subtotalEl = document.getElementById('summary-subtotal');
            var totalEl = document.getElementById('summary-total');
            var payBtn = document.getElementById('payBtn');

            if (!container) return;

            if (cart.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:40px;color:#888"><h2 style="font-size:1.3rem">🛒 Your cart is empty</h2><p style="margin-top:8px">Go back and add items!</p><a href="oven-xpress.html" style="display:inline-block;margin-top:16px;padding:10px 20px;background:#ff6b00;color:#fff;text-decoration:none;border-radius:8px;font-weight:700">Browse Menu</a></div>';
                if (subtotalEl) subtotalEl.textContent = '₹0';
                if (totalEl) totalEl.textContent = '₹10';
                if (payBtn) { payBtn.disabled = true; payBtn.style.opacity = '0.5'; payBtn.style.cursor = 'not-allowed'; }
                return;
            }

            if (payBtn) { payBtn.disabled = false; payBtn.style.opacity = '1'; payBtn.style.cursor = 'pointer'; }

            var subtotal = 0;
            var html = '';
            cart.forEach(function(item, index) {
                var price = parseInt(item.price, 10);
                if (isNaN(price)) price = 0;
                var qty = parseInt(item.quantity, 10) || 1;
                subtotal += price * qty;
                html += '<div class="summary-item">'
                    + '<div class="item-info">'
                    + '<img src="' + (item.img || '') + '" class="item-img" onerror="this.src=\'https://via.placeholder.com/60x60?text=Food\'">'
                    + '<div class="item-details">'
                    + '<h4>' + item.name + '</h4>'
                    + '<div style="color:#ff6b00;font-weight:600;font-size:0.9rem">₹' + price + ' each</div>'
                    + '<div class="qty-controls">'
                    + '<button class="qty-btn" onclick="updateChkQty(' + index + ',-1)">-</button>'
                    + '<span class="qty-display">' + qty + '</span>'
                    + '<button class="qty-btn" onclick="updateChkQty(' + index + ',1)">+</button>'
                    + '<button class="remove-btn" onclick="removeChkItem(' + index + ')">🗑️</button>'
                    + '</div></div></div>'
                    + '<div class="item-price">₹' + (price * qty) + '</div>'
                    + '</div>';
            });

            container.innerHTML = html;
            finalTotal = subtotal + 10;
            if (subtotalEl) subtotalEl.textContent = '₹' + subtotal;
            if (totalEl) totalEl.textContent = '₹' + finalTotal;
            console.log('[Checkout] Subtotal:', subtotal, '| Total:', finalTotal);
        }

        // =============================================
        // QTY / REMOVE
        // =============================================
        function updateChkQty(index, change) {
            cart[index].quantity = (parseInt(cart[index].quantity) || 1) + change;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
                showToast('Item Removed');
            } else {
                showToast('Quantity Updated');
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCheckoutCart();
        }

        function removeChkItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            showToast('Item Removed');
            renderCheckoutCart();
        }

        // ===== CHECKOUT SKELETON LOADER =====
        function initCheckoutSkeleton() {
            const formCard = document.querySelector('.checkout-form');
            const summaryCard = document.querySelector('.checkout-summary');
            if (!formCard || !summaryCard) return;

            formCard.classList.add('content-loading-container');
            summaryCard.classList.add('content-loading-container');

            const formSkeleton = document.createElement('div');
            formSkeleton.className = 'skeleton-wrapper';
            formSkeleton.id = 'form-skeleton';
            formSkeleton.setAttribute('aria-hidden', 'true');
            formSkeleton.style.padding = '32px';
            formSkeleton.style.background = '#fff';
            formSkeleton.style.display = 'flex';
            formSkeleton.style.flexDirection = 'column';
            formSkeleton.style.gap = '20px';
            formSkeleton.innerHTML = `
                <div class="skeleton-block" style="width:150px;height:24px;margin-bottom:12px;"></div>
                <div>
                    <div class="skeleton-block" style="width:100px;height:14px;margin-bottom:8px;"></div>
                    <div class="skeleton-block" style="width:100%;height:44px;"></div>
                </div>
                <div>
                    <div class="skeleton-block" style="width:130px;height:14px;margin-bottom:8px;"></div>
                    <div class="skeleton-block" style="width:100%;height:44px;"></div>
                </div>
                <div>
                    <div class="skeleton-block" style="width:100px;height:14px;margin-bottom:8px;"></div>
                    <div class="skeleton-block" style="width:100%;height:44px;"></div>
                </div>
                <div>
                    <div class="skeleton-block" style="width:120px;height:14px;margin-bottom:8px;"></div>
                    <div class="skeleton-block" style="width:100%;height:44px;"></div>
                </div>
                <div class="skeleton-block" style="width:150px;height:24px;margin-top:20px;margin-bottom:12px;"></div>
                <div style="display:flex;gap:16px;">
                    <div class="skeleton-block" style="flex:1;height:54px;border-radius:12px;"></div>
                    <div class="skeleton-block" style="flex:1;height:54px;border-radius:12px;"></div>
                </div>
            `;
            formCard.appendChild(formSkeleton);

            const summarySkeleton = document.createElement('div');
            summarySkeleton.className = 'skeleton-wrapper';
            summarySkeleton.id = 'summary-skeleton';
            summarySkeleton.setAttribute('aria-hidden', 'true');
            summarySkeleton.style.padding = '32px';
            summarySkeleton.style.background = '#fff';
            summarySkeleton.style.display = 'flex';
            summarySkeleton.style.flexDirection = 'column';
            summarySkeleton.style.gap = '16px';
            summarySkeleton.innerHTML = `
                <div class="skeleton-block" style="width:150px;height:24px;margin-bottom:12px;"></div>
                <div style="display:flex;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid #f1f5f9;">
                    <div class="skeleton-block" style="width:100px;height:16px;"></div>
                    <div class="skeleton-block" style="width:40px;height:16px;"></div>
                </div>
                <div style="display:flex;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid #f1f5f9;opacity:0.7;">
                    <div class="skeleton-block" style="width:120px;height:16px;"></div>
                    <div class="skeleton-block" style="width:40px;height:16px;"></div>
                </div>
                <div style="display:flex;justify-content:space-between;margin-top:12px;">
                    <div class="skeleton-block" style="width:80px;height:14px;"></div>
                    <div class="skeleton-block" style="width:50px;height:14px;"></div>
                </div>
                <div style="display:flex;justify-content:space-between;">
                    <div class="skeleton-block" style="width:60px;height:14px;"></div>
                    <div class="skeleton-block" style="width:40px;height:14px;"></div>
                </div>
                <div style="display:flex;justify-content:space-between;border-top:1px solid #f1f5f9;padding-top:16px;margin-top:8px;">
                    <div class="skeleton-block" style="width:90px;height:18px;"></div>
                    <div class="skeleton-block" style="width:60px;height:18px;"></div>
                </div>
                <div class="skeleton-block skeleton-button" style="width:100%;height:48px;margin-top:16px;"></div>
            `;
            summaryCard.appendChild(summarySkeleton);

            const hideSkeleton = () => {
                setTimeout(() => {
                    formCard.classList.add('loaded');
                    summaryCard.classList.add('loaded');
                    formSkeleton.classList.add('fade-out');
                    summarySkeleton.classList.add('fade-out');
                    setTimeout(() => {
                        formSkeleton.remove();
                        summarySkeleton.remove();
                    }, 300);
                }, 600);
            };

            if (document.readyState === 'complete') {
                hideSkeleton();
            } else {
                window.addEventListener('load', hideSkeleton);
            }
        }

        // =============================================
        // DOM READY — render & auto-fill
        // =============================================
        document.addEventListener('DOMContentLoaded', function() {
            renderCheckoutCart();
            initCheckoutSkeleton();

            var storedReg = localStorage.getItem('studentRegNo');
            if (storedReg) {
                var regInput = document.getElementById('s_reg');
                if (regInput) {
                    regInput.value = storedReg;
                    regInput.readOnly = true;
                    regInput.style.background = '#f5f5f5';
                    regInput.style.cursor = 'not-allowed';
                }
            }
        });

        // Re-render if storage changes in another tab
        window.addEventListener('storage', function(e) {
            if (!e.key || e.key === 'cart') renderCheckoutCart();
        });

        // =============================================
        // CHECKOUT HANDLER
        // =============================================
        function handleCheckout() {
            var name = document.getElementById('s_name').value.trim();
            var reg = document.getElementById('s_reg').value.trim();
            var canteen = document.getElementById('s_canteen').value;
            var time = document.getElementById('s_time').value;

            if (!name || !reg) {
                showToast('Please fill your name and registration number!');
                return;
            }
            if (cart.length === 0) {
                showToast('Your cart is empty!');
                return;
            }

            var payBtn = document.getElementById('payBtn');
            payBtn.classList.add('loading');

            if (selectedMethod === 'Razorpay') {
                openRazorpay(name, reg, canteen, time, payBtn);
            } else {
                showToast('Processing UPI Payment...');
                setTimeout(function() { processOrderSuccess(reg, canteen, time); }, 1500);
            }
        }

        // =============================================
        // RAZORPAY
        // =============================================
        function openRazorpay(name, reg, canteen, time, btnEl) {
            var options = {
                key: 'rzp_test_T7OTyW6gadCfnH',
                amount: Math.round(finalTotal * 100),
                currency: 'INR',
                name: 'LPU Canteen',
                description: 'Campus Pickup Order',
                handler: function(response) {
                    showToast('Payment Successful! ✅');
                    setTimeout(function() { processOrderSuccess(reg, canteen, time); }, 1000);
                },
                theme: { color: '#ff6b00' },
                modal: {
                    ondismiss: function() { btnEl.classList.remove('loading'); }
                }
            };
            try {
                var rzp = new Razorpay(options);
                rzp.on('payment.failed', function() {
                    showToast('Mock Payment Successful! ✅');
                    setTimeout(function() { processOrderSuccess(reg, canteen, time); }, 1000);
                });
                rzp.open();
            } catch(err) {
                showToast('Mock Payment Successful! ✅');
                setTimeout(function() { processOrderSuccess(reg, canteen, time); }, 1000);
            }
        }

        // =============================================
        // ORDER SUCCESS
        // =============================================
        async function processOrderSuccess(reg, canteen, timeSlot) {
            try {
                const studentData = JSON.parse(localStorage.getItem("studentData"));

                const orderData = {
                    studentName: studentData?.name || "Student",
                    registrationNumber: reg,
                    canteen: canteen,
                    items: cart,
                    totalAmount: finalTotal,
                    pickupSlot: timeSlot,
                    orderType: "Takeaway"
                };

                const response = await fetch("https://backend1-i1jb.onrender.com/api/orders/create", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(orderData),
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem("latestOrder", JSON.stringify(data.order));
                    localStorage.setItem("latestToken", data.tokenNumber);
                    localStorage.setItem("cart", JSON.stringify([]));
                    showToast("Order Placed Successfully! ✅");
                    setTimeout(function() {
                        window.location.href = "orders.html?token=" + data.tokenNumber;
                    }, 1500);
                } else {
                    showToast(data.message || "Order Failed");
                }

            } catch (error) {
                // Backend unavailable — use frontend demo mode
                console.warn('[Order] Backend unavailable, using demo mode:', error.message);

                var rushes = ['🟢 Low Rush', '🟡 Moderate Rush', '🔴 Heavy Rush'];
                var token = 'TKN-' + Math.floor(Math.random() * 900 + 100);
                var orderId = 'ORD' + Math.floor(Math.random() * 90000 + 10000);
                var qrData = 'Order:' + orderId + '|Token:' + token + '|Reg:' + reg + '|Total:₹' + finalTotal;

                var orders = [];
                try { orders = JSON.parse(localStorage.getItem('canteenOrders')) || []; } catch(e) {}

                orders.unshift({
                    id: orderId,
                    token: token,
                    regNo: reg,
                    canteen: canteen,
                    timeSlot: timeSlot,
                    items: cart,
                    total: finalTotal,
                    status: 'Payment Successful',
                    date: new Date().toLocaleString(),
                    rush: rushes[Math.floor(Math.random() * rushes.length)],
                    eta: Math.floor(Math.random() * 15 + 10) + ' mins',
                    qrData: qrData
                });

                localStorage.setItem('canteenOrders', JSON.stringify(orders));
                localStorage.setItem('cart', JSON.stringify([]));
                showToast('Order Placed! ✅');
                setTimeout(function() {
                    window.location.href = 'orders.html?new_token=' + token;
                }, 1500);
            }
        }
    </script>
</body>
</html>
